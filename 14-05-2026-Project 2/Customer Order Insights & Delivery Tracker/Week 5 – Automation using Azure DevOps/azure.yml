trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.10'
      addToPath: true

  - script: |
      pip install pandas numpy
    displayName: 'Install Dependencies'

  - script: |
      python analysis.py > output_log.txt 2>&1
      echo "Analysis completed successfully."
    displayName: 'Run Order Delay Analysis'

  - script: |
      echo "=== Delay Summary Log ===" >> output_log.txt
      cat output_log.txt
    displayName: 'Print Log Summary'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: 'output_log.txt'
      artifactName: 'DelayReport'
    displayName: 'Publish Log as Artifact'